apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: game-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis-tcp
              containerPort: 6379
              protocol: TCP
          # Redisプロセスが応答できない状態が続く場合にPodを再作成するために確認する。
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          # キャッシュ用Redisが接続受付できることを確認してから、Service経由の通信を渡す。
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 1
            periodSeconds: 5
